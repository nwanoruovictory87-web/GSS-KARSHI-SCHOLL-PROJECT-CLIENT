<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://cdn.socket.io/4.8.3/socket.io.min.js"
      integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0"
      crossorigin="anonymous"
    ></script>
    <title>Student | Tracker</title>
  </head>
  <style>
    body {
      background-color: rgb(26, 24, 58);
    }
    :root {
      --padding-left: 12px;
      --padding-top: 12px;
      --padding-right: 12px;
      --padding-bottom: 12px;
      --text-color: #ebe6e6;
      --body-color: rgb(26, 24, 58);
      --pramary-dark-blue: #08081f;
    }
    .main {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .root {
      width: 100%;
      height: fit-content;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .input-tracking-id-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-left: var(--padding-left);
      padding-right: var(--padding-right);
      padding-bottom: var(--padding-bottom);
      padding-top: var(--padding-top);
      background-color: var(--pramary-dark-blue);
      border-radius: 6px;
      display: none;
    }
    #input-tracking-head-text {
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 800;
      font-family: sans-serif;
      color: var(--text-color);
    }
    #input-tracking-input {
      background-color: rgb(156, 152, 152);
      padding-left: 3px;
      width: 100%;
      height: 25px;
      border-radius: 4px;
      border-width: 3px;
    }
    #input-tracking-input::placeholder {
      color: black;
      padding-left: 2px;
    }
    #input-tracking-track-btw {
      margin-top: 10px;
      width: fit-content;
      height: fit-content;
      padding: 7px;
      padding-top: 7px;
      padding-bottom: 7px;
      text-align: center;
      border-radius: 7px;
      font-weight: 600;
      font-family: sans-serif;
      background: rgb(134, 227, 134);
      border-color: rgb(134, 227, 134);
      box-shadow: 1px 1px 6px 0px rgb(5, 247, 53);
      color: black;
    }
    /**/
    .panic-tracking-id-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-left: var(--padding-left);
      padding-right: var(--padding-right);
      padding-bottom: var(--padding-bottom);
      padding-top: var(--padding-top);
      background-color: var(--pramary-dark-blue);
      border-radius: 6px;
    }
    .panic-btw {
      padding: 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: clamp(16px, 3vw, 18px);
      background-color: rgba(251, 12, 12, 0.961);
      border-color: red;
      color: var(--text-color);
    }
    #state {
      display: block;
      width: 100%;
      height: 15px;
      background-color: green;
      margin-bottom: 10px;
      border-radius: 4px;
    }
  </style>
  <body>
    <main class="main">
      <article class="root">
        <section class="input-tracking-id-main">
          <h2 id="input-tracking-head-text">Enter Tracking ID</h2>
          <input id="input-tracking-input" placeholder="Enter ID..." />
          <button id="input-tracking-track-btw">Start Tracking</button>
        </section>
        <section class="panic-tracking-id-main">
          <span id="state"></span>
          <button class="panic-btw">S0S</button>
        </section>
      </article>
    </main>
    <script type="module">
      const server = "http://localhost:3000";
      //
      document
        .getElementById("input-tracking-track-btw")
        .addEventListener("click", vaildateTrackingId);
      //
      async function vaildateTrackingId() {
        const inputData = document.getElementById("input-tracking-input");
        if (inputData.value.trim() === "" || inputData.value.length < 30) {
          console.log("empty input ux");
          return (
            (inputData.style.borderWidth = "3px"),
            (inputData.style.borderColor = "red")
          );
        } else {
          inputData.style.borderWidth = "3px";
          inputData.style.borderColor = "black";
        }
        try {
          const validateId = await fetch(
            `${server}/students/validate/id/${inputData.value}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            },
          );
          const responds = await validateId.json();
          console.log(responds);
          if (responds.ok && responds.isInRecords) {
            startTracking(inputData.value);
          }
        } catch (error) {
          console.log("error :", error);
        }
      }
      //
      function startTracking(trackingID) {
        const socket = io(server);
        //
        socket.on("connect", () => {
          console.log("socket connected ");
          //
          socket.on("send-live-location", () => {
            getGpsLocation(socket);
          });
        });
        function getGpsLocation(socketRef) {
          // 1. Check if the browser supports the Geolocation API
          if ("geolocation" in navigator) {
            // Configuration options for high-accuracy live tracking
            const options = {
              enableHighAccuracy: true, // Forces the device to use GPS instead of Wi-Fi/IP routing
              timeout: 5000, // Maximum time (ms) allowed to return a position
              maximumAge: 0, // Forces the browser to fetch a fresh position, not a cached one
            };

            // 2. Start watching the live position
            const watchId = navigator.geolocation.watchPosition(
              successCallback,
              errorCallback,
              options,
            );
          } else {
            console.error("Geolocation is not supported by this browser.");
          }

          // Success callback triggers every time the device's location changes
          function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy; // Accuracy radius in meters
            console.log(`Live Location - Lat: ${latitude}, Lon: ${longitude}`);
            console.log(`Accuracy: ${accuracy} meters`);
            // Optional: Update your HTML UI elements here
            //
            const DATE = new Date();
            const locationData = {
              trackingID: trackingID,
              latitude: latitude,
              longitude: longitude,
              accuracy: accuracy,
              trackingState: 1,
              watchInfo: {
                batteryPercent: "0",
                watchTime: `${DATE.getHours() >= 10 ? DATE.getHours() : `0${DATE.getHours()}`}:${DATE.getMinutes() >= 10 ? DATE.getMinutes() : `0${DATE.getMinutes()}`}`,
                watchDate: `${DATE.getDay() >= 10 ? DATE.getDay() : `0${DATE.getDay()}`}/${DATE.getMonth() + 1 >= 10 ? DATE.getMonth() + 1 : `0${DATE.getMonth() + 1}`}/${DATE.getFullYear()}`,
              },
              locationInfo: {
                locationAccuracy: 0,
                lastTransmistedDate: `${DATE.getDay() >= 10 ? DATE.getDay() : `0${DATE.getDay()}`}/${DATE.getMonth() + 1 >= 10 ? DATE.getMonth() + 1 : `0${DATE.getMonth() + 1}`}/${DATE.getFullYear()}`,
                lastThreeKnownLocation: [{ latitude: 0, longitude: 0 }],
              },
            };
            //
            socketRef.emit("get-live-location", locationData, trackingID);
          }
          //

          // Error callback handles permission denials or hardware failures
          function errorCallback(error) {
            switch (error.code) {
              case error.PERMISSION_DENIED:
                console.error("User denied the request for Geolocation.");
                break;
              case error.POSITION_UNAVAILABLE:
                console.error(
                  "Location information is unavailable (GPS signal lost).",
                );
                break;
              case error.TIMEOUT:
                console.error("The request to get user location timed out.");
                break;
              default:
                console.error("An unknown error occurred.", error.message);
            }
          }

          // 3. Optional: Stop tracking whenever you want (e.g., when a user leaves a page)
          // navigator.geolocation.clearWatch(watchId);
        }
      }
    </script>
  </body>
</html>
