<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://cdn.socket.io/4.8.3/socket.io.min.js"
      integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0"
      crossorigin="anonymous"
    ></script>
    <title>Student | Tracker</title>
  </head>
  <style>
    .main {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .root {
      width: 100%;
      height: fit-content;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .input-tracking-id-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #input-tracking-head-text {
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 800;
      font-family: sans-serif;
    }
    #input-tracking-input {
      background-color: rgb(156, 152, 152);
      padding-left: 3px;
      width: 100%;
      height: 25px;
      border-radius: 4px;
      border: none;
    }
    #input-tracking-input::placeholder {
      color: black;
      padding-left: 2px;
    }
    #input-tracking-track-btw {
      margin-top: 10px;
      width: fit-content;
      height: fit-content;
      padding: 7px;
      padding-top: 7px;
      padding-bottom: 7px;
      text-align: center;
      border-radius: 7px;
      font-weight: 600;
      font-family: sans-serif;
      background: rgb(134, 227, 134);
      border-color: rgb(134, 227, 134);
    }
  </style>
  <body>
    <main class="main">
      <article class="root">
        <section class="input-tracking-id-main">
          <h2 id="input-tracking-head-text">Enter Tracking ID</h2>
          <input id="input-tracking-input" placeholder="Enter ID..." />
          <button id="input-tracking-track-btw">Start Tracking</button>
        </section>
      </article>
    </main>
    <script type="module">
      const socket = io("http://localhost:3000");
      socket.on("connect", () => {
        console.log("Connected smoothly via Socket.io!");
      });
    </script>
  </body>
</html>
