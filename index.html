<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://cdn.socket.io/4.8.3/socket.io.min.js"
      integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0"
      crossorigin="anonymous"
    ></script>
    <title>Student | Tracker</title>
  </head>
  <style>
    body {
      background-color: rgb(26, 24, 58);
    }
    :root {
      --padding-left: 12px;
      --padding-top: 12px;
      --padding-right: 12px;
      --padding-bottom: 12px;
      --text-color: #ebe6e6;
      --body-color: rgb(26, 24, 58);
      --pramary-dark-blue: #08081f;
    }
    .main {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .root {
      width: 100%;
      height: fit-content;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .input-tracking-id-main {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-left: var(--padding-left);
      padding-right: var(--padding-right);
      padding-bottom: var(--padding-bottom);
      padding-top: var(--padding-top);
      background-color: var(--pramary-dark-blue);
      border-radius: 6px;
    }
    #input-tracking-head-text {
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 800;
      font-family: sans-serif;
      color: var(--text-color);
    }
    #input-tracking-input {
      background-color: rgb(156, 152, 152);
      padding-left: 3px;
      width: 100%;
      height: 25px;
      border-radius: 4px;
      border-width: 3px;
    }
    #input-tracking-input::placeholder {
      color: black;
      padding-left: 2px;
    }
    #input-tracking-track-btw {
      margin-top: 10px;
      width: fit-content;
      height: fit-content;
      padding: 7px;
      padding-top: 7px;
      padding-bottom: 7px;
      text-align: center;
      border-radius: 7px;
      font-weight: 600;
      font-family: sans-serif;
      background: rgb(134, 227, 134);
      border-color: rgb(134, 227, 134);
      box-shadow: 1px 1px 6px 0px rgb(5, 247, 53);
      color: black;
    }
    /**/
    .panic-tracking-id-main {
      width: 100%;
      max-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-left: var(--padding-left);
      padding-right: var(--padding-right);
      padding-bottom: var(--padding-bottom);
      padding-top: var(--padding-top);
      background-color: var(--pramary-dark-blue);
      border-radius: 6px;
      margin-left: 10px;
      margin-right: 10px;
      display: none;
    }
    #panic-btw {
      width: 100%;
      height: 70px;
      padding: 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: clamp(16px, 3vw, 18px);
      background-color: rgba(251, 12, 12, 0.961);
      border-color: red;
      color: var(--text-color);
    }

    #state {
      display: block;
      width: 100%;
      height: 20px;
      background-color: gray;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    @media (min-height: 300px) {
      #panic-btw {
        height: 100px;
      }
      #state {
        height: 30px;
      }
    }
  </style>
  <body>
    <main class="main">
      <article class="root">
        <section class="input-tracking-id-main">
          <h2 id="input-tracking-head-text">Enter Tracking ID</h2>
          <input id="input-tracking-input" placeholder="Enter ID..." />
          <button id="input-tracking-track-btw">Start Tracking</button>
        </section>
        <section class="panic-tracking-id-main">
          <span id="state"></span>
          <button id="panic-btw">S0S</button>
        </section>
      </article>
    </main>
    <script type="module">
      //"https://gss-karshi-scholl-project-backend.onrender.com"
      //http://localhost:3000
      const server = "http://localhost:3000";
      const beepAlertSound = "./beep.mp3";
      //PAGES
      const inputDOMSection = document.querySelector(".input-tracking-id-main");
      const panicDOMSection = document.querySelector(".panic-tracking-id-main");
      const inputData = document.getElementById("input-tracking-input");
      //
      //
      document
        .getElementById("input-tracking-track-btw")
        .addEventListener("click", vaildateTrackingId);
      //
      let trackingID = null;
      let isPanicRequstSent = false;
      let isRespondsRecived = true;
      //
      let lastKnownLocation = {
        latitude: 0,
        longitude: 0,
      };
      //
      async function vaildateTrackingId() {
        if (inputData.value.trim() === "" || inputData.value.length < 30) {
          console.log("empty input ux");
          return (
            (inputData.style.borderWidth = "3px"),
            (inputData.style.borderColor = "red")
          );
        } else {
          inputData.style.borderWidth = "3px";
          inputData.style.borderColor = "black";
        }
        try {
          const validateId = await fetch(
            `${server}/students/validate/id/${inputData.value}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            },
          );
          const responds = await validateId.json();
          console.log(responds);
          if (responds.ok && responds.isInRecords) {
            trackingID = inputData.value;
            inputDOMSection.style.display = "none";
            panicDOMSection.style.display = "block";
          }
        } catch (error) {
          console.log("error :", error);
        }
      }
      let isAlertGoing = false;
      //
      function startTracking() {
        const panicBtw = document.getElementById("panic-btw");
        const watchState = document.getElementById("state");
        //

        //
        const socket = io(server);
        //

        panicBtw.addEventListener("click", () => {
          if (!trackingID || isAlertGoing) return;
          isAlertGoing = true;
          getGpsLocation(socket, true);
        });
        //
        let isConnected = false;
        socket.on("connect", () => {
          console.log("socket connected ");
          if (isConnected) return;
          isConnected = true;
          //
          //
          setInterval(() => {
            if (!trackingID) return;
            socket.emit("get-watch-state", trackingID);
          }, 2000); // requst watch state every 2 sec
          //
          socket.on("send-watch-state", (state) => {
            switch (state) {
              case 0:
                watchState.style.backgroundColor = "purple";
                break;
              case 1:
                watchState.style.backgroundColor = "green";
                break;
              case 2:
                watchState.style.backgroundColor = "yellow";
                break;
              case 3:
                watchState.style.backgroundColor = "red";
                break;
              default:
                watchState.style.backgroundColor = "gray";
                break;
            }
          });
          //
          socket.on("send-live-location", () => {
            console.log("whats your location");
            if (!trackingID) return;
            getGpsLocation(socket, false);
          });
          //
          let isRequstPending = false;
          socket.on("are-you-there-client", async () => {
            try {
              if (!trackingID) return;
              if (!isRespondsRecived) return;
              isRespondsRecived = false;
              if (!isRequstPending) {
                isRequstPending = true;
                const notificationAlert = new Audio(beepAlertSound);
                await notificationAlert.play();
                if (
                  window.confirm("Safty varification click (OK) to verify?")
                ) {
                  isRespondsRecived = true;
                  isRequstPending = false;
                  socket.emit("am-here", trackingID);
                } else {
                  isRespondsRecived = true;
                  isRespondsRecived = true;
                  isRequstPending = false;
                }
              }
            } catch (error) {
              console.log(error);
            }
          });
          //
          socket.on("are-you-active-client", () => {
            if (!trackingID) return;
            socket.emit("am-active-client", trackingID);
          });
          //
          socket.on("get-tracking-id-client", (trackingID) => {
            copyTextToClipboard(trackingID);
            console.log(trackingID);
          });
          //
        });
      }
      startTracking();
      //
      function getGpsLocation(socket, shouldPanic) {
        // 1. Check if the browser supports the Geolocation API
        if ("geolocation" in navigator) {
          // Configuration options for high-accuracy live tracking
          const options = {
            enableHighAccuracy: true, // Forces the device to use GPS instead of Wi-Fi/IP routing
            timeout: 5000, // Maximum time (ms) allowed to return a position
            maximumAge: 0, // Forces the browser to fetch a fresh position, not a cached one
          };

          // 2. Start watching the live position
          const watchId = navigator.geolocation.watchPosition(
            successCallback,
            errorCallback,
            options,
          );
        } else {
          console.error("Geolocation is not supported by this browser.");
        }

        // Success callback triggers every time the device's location changes
        function successCallback(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy; // Accuracy radius in meters
          console.log(`Live Location - Lat: ${latitude}, Lon: ${longitude}`);
          console.log(`Accuracy: ${accuracy} meters`);
          // Optional: Update your HTML UI elements here
          //
          const DATE = new Date();
          const locationData = {
            trackingID: trackingID,
            latitude: latitude,
            longitude: longitude,
            accuracy: accuracy,
            trackingState: shouldPanic ? 3 : 1,
            watchInfo: {
              batteryPercent: "0",
              watchTime: `${DATE.getHours() >= 10 ? DATE.getHours() : `0${DATE.getHours()}`}:${DATE.getMinutes() >= 10 ? DATE.getMinutes() : `0${DATE.getMinutes()}`}`,
              watchDate: `${DATE.getDay() >= 10 ? DATE.getDay() : `0${DATE.getDay()}`}/${DATE.getMonth() + 1 >= 10 ? DATE.getMonth() + 1 : `0${DATE.getMonth() + 1}`}/${DATE.getFullYear()}`,
            },
            locationInfo: {
              locationAccuracy: accuracy,
              lastTransmistedDate: `${DATE.getDay() >= 10 ? DATE.getDay() : `0${DATE.getDay()}`}/${DATE.getMonth() + 1 >= 10 ? DATE.getMonth() + 1 : `0${DATE.getMonth() + 1}`}/${DATE.getFullYear()}`,
              lastThreeKnownLocation: [{ latitude: 0, longitude: 0 }],
            },
          };
          //
          lastKnownLocation.latitude = latitude;
          lastKnownLocation.longitude = longitude;
          //
          if (shouldPanic) {
            socket.emit("get-panic-call", locationData, trackingID);
            shouldPanic = false;
            isAlertGoing = false;

            alert("panic alert sent");
          } else {
            socket.emit("get-live-location", locationData, trackingID);
          }
        }
        //
        // Error callback handles permission denials or hardware failures
        function errorCallback(error) {
          const DATE = new Date();
          const locationData = {
            trackingID: trackingID,
            latitude: lastKnownLocation.latitude,
            longitude: lastKnownLocation.longitude,
            accuracy: lastKnownLocation.accuracy,
            trackingState: shouldPanic ? 3 : 1,
            watchInfo: {
              batteryPercent: "0",
              watchTime: `${DATE.getHours() >= 10 ? DATE.getHours() : `0${DATE.getHours()}`}:${DATE.getMinutes() >= 10 ? DATE.getMinutes() : `0${DATE.getMinutes()}`}`,
              watchDate: `${DATE.getDay() >= 10 ? DATE.getDay() : `0${DATE.getDay()}`}/${DATE.getMonth() + 1 >= 10 ? DATE.getMonth() + 1 : `0${DATE.getMonth() + 1}`}/${DATE.getFullYear()}`,
            },
            locationInfo: {
              locationAccuracy: 0,
              lastTransmistedDate: `${DATE.getDay() >= 10 ? DATE.getDay() : `0${DATE.getDay()}`}/${DATE.getMonth() + 1 >= 10 ? DATE.getMonth() + 1 : `0${DATE.getMonth() + 1}`}/${DATE.getFullYear()}`,
              lastThreeKnownLocation: [{ latitude: 0, longitude: 0 }],
            },
          };
          switch (error.code) {
            case error.PERMISSION_DENIED:
              console.error("User denied the request for Geolocation.");
              break;
            case error.POSITION_UNAVAILABLE:
              console.error(
                "Location information is unavailable (GPS signal lost).",
              );
              if (shouldPanic && lastKnownLocation.latitude != 0) {
                socket.emit("get-panic-call", locationData, trackingID);
                shouldPanic = false;
                isAlertGoing = false;
                alert("panic alert sent");
              } else if (shouldPanic) {
                alert(`panic alert faild: ${error.message}`);
                isAlertGoing = false;
                shouldPanic = false;
              }
              break;
            case error.TIMEOUT:
              console.error("The request to get user location timed out.");
              if (shouldPanic && lastKnownLocation.latitude != 0) {
                socket.emit("get-panic-call", locationData, trackingID);
                shouldPanic = false;
                isAlertGoing = false;
                alert("panic alert sent");
              } else if (shouldPanic) {
                alert(`panic alert faild: ${error.message}`);
                isAlertGoing = false;
                shouldPanic = false;
              }
              break;
            default:
              console.error("An unknown error occurred.", error.message);
              if (shouldPanic && lastKnownLocation.latitude != 0) {
                socket.emit("get-panic-call", locationData, trackingID);
                shouldPanic = false;
                isAlertGoing = false;
                alert("panic alert sent");
              } else if (shouldPanic) {
                alert(`panic alert faild: ${error.message}`);
                isAlertGoing = false;
                shouldPanic = false;
              }
          }
        }

        // 3. Optional: Stop tracking whenever you want (e.g., when a user leaves a page)
        // navigator.geolocation.clearWatch(watchId);
      }
      //
      function copyTextToClipboard(text) {
        if (trackingID) return;
        const userAgreed = window.confirm(
          "Would you like to copy the tracking ID to your input section?",
        );
        if (userAgreed) {
          inputData.value = text;
        }
      }
    </script>
  </body>
</html>
